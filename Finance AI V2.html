<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance AI v2</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#f4f7fc;--card:#fff;--txt:#111827;--roxo:#6D28D9}.dark{--bg:#09090B;--card:#18181B;--txt:#fff}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:90px}header{background:linear-gradient(135deg,#6D28D9,#9333EA);padding:16px;color:#fff}.card{background:var(--card);margin:12px;padding:16px;border-radius:16px}.saldo{background:linear-gradient(135deg,#6D28D9,#9333EA);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px}.mini,.btn{background:var(--card);padding:12px;border-radius:12px;text-align:center}.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px}.btn{border:none}input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}.botao{width:100%;padding:12px;background:#6D28D9;color:#fff;border:none;border-radius:10px}.item{padding:10px;background:#f0f0f0;border-radius:10px;margin:8px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:10px}</style></head><body><header><h2>💰 Finance AI V2</h2><button onclick="document.body.classList.toggle('dark')">🌙</button></header><div class="card saldo"><h3>Patrimônio Atual</h3><h1>R$ 3.270,00</h1></div><div class="grid"><div class="mini">Receitas<br><b>R$9.500</b></div><div class="mini">Despesas<br><b>R$6.230</b></div><div class="mini">Economia<br><b>R$3.270</b></div></div><div class="acoes"><button class="btn">➕ Receita</button><button class="btn">➖ Despesa</button><button class="btn">💳 Nubank</button><button class="btn">📅 Contas</button></div><div class="card"><h3>💰 Lançamentos</h3><form id="f"><input type="date" id="d" required><input id="desc" placeholder="Descrição" required><select id="nat"><option>Receita</option><option>Despesa</option></select><input type="number" step="0.01" id="val" placeholder="Valor" required><button class="botao">Salvar</button></form><div id="lista"></div></div><div class="card"><h3>📊 Receitas x Despesas</h3><canvas id="g1"></canvas></div><div class="card"><h3>🥧 Categorias</h3><canvas id="g2"></canvas></div><div class="card"><h3>💳 Nubank</h3><canvas id="g3"></canvas></div><div class="card"><h3>📈 Status</h3><canvas id="g4"></canvas></div><div class="bottom"><div>🏠</div><div>💰</div><div>💳</div><div>📊</div><div>⚙️</div></div><script>let lanc=[{descricao:'Salário',valor:9500,nat:'Receita'},{descricao:'Internet',valor:100.99,nat:'Despesa'}];function render(){lista.innerHTML='';lanc.forEach((x,i)=>lista.innerHTML+=`<div class=item><b>${x.descricao}</b> R$ ${x.valor}<br><button onclick='ed(${i})'>✏️</button><button onclick='del(${i})'>🗑️</button></div>`)}function ed(i){let n=prompt('Descrição',lanc[i].descricao);if(n){lanc[i].descricao=n;render()}}function del(i){lanc.splice(i,1);render()}f.onsubmit=e=>{e.preventDefault();lanc.push({descricao:desc.value,valor:val.value,nat:nat.value});f.reset();render()};render();new Chart(g1,{type:'bar',data:{labels:['Nov','Dez'],datasets:[{label:'Receitas',data:[9500,7500]},{label:'Despesas',data:[6230,10150]}]}});new Chart(g2,{type:'doughnut',data:{labels:['Moradia','Empréstimos','Veículos'],datasets:[{data:[1200,5890,856]}]}});new Chart(g3,{type:'polarArea',data:{labels:['Utilizado','Disponível'],datasets:[{data:[8161.96,1638.04]}]}});new Chart(g4,{type:'pie',data:{labels:['Pago','Aberto','Atrasado'],datasets:[{data:[26,19,1]}]}});</script></body></html>
